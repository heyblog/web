version: "2"

sql:
  - engine: postgresql
    schema: internal/database/migrations/sql
    queries: internal/database/queries
    gen:
      go:
        package: dbgen
        out: internal/database/gen
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
