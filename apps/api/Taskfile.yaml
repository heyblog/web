# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  install:
    desc: Download API dependencies
    cmds:
      - go mod download

  dev:
    desc: Start API server
    dotenv:
      - ../../.env.development
    cmds:
      - go run .

  build:
    desc: Build API
    cmds:
      - mkdir -p dist
      - go build -buildvcs=false -trimpath -ldflags="-s -w" -o dist/heyblog-api .

  test:
    desc: Test API
    cmds:
      - go test ./...

  test:race:
    desc: Test API with the race detector
    cmds:
      - go test -race ./...

  test:integration:
    desc: Test API infrastructure with PostgreSQL/AGE and Redis containers
    cmds:
      - go test -count=1 -tags=integration ./internal/integration ./internal/temp/dataimport

  sqlc:generate:
    desc: Generate pgx/v5 data access code
    cmds:
      - go tool sqlc generate

  sqlc:vet:
    desc: Validate SQL queries against migrations
    cmds:
      - go tool sqlc vet

  sqlc:diff:
    desc: Check that sqlc generated code is current
    cmds:
      - go tool sqlc diff

  lint:
    desc: Lint API Go files
    cmds:
      - golangci-lint run --config ../../.golangci.yaml ./...

  lint:fix:
    desc: Lint and fix API Go files
    cmds:
      - golangci-lint run --config ../../.golangci.yaml --fix ./...

  format:
    desc: Format API Go files and sort imports
    aliases: [fmt]
    cmds:
      - golangci-lint fmt --config ../../.golangci.yaml

  format:check:
    desc: Check API Go formatting and import sorting
    aliases: [fmt:check]
    cmds:
      - golangci-lint fmt --config ../../.golangci.yaml --diff

  vulncheck:
    desc: Check API Go vulnerabilities
    cmds:
      - go tool govulncheck ./...

  check:
    desc: Run API static checks
    cmds:
      - task: sqlc:vet
      - task: sqlc:diff
      - task: format:check
      - task: lint

  security:
    desc: Run API vulnerability checks
    cmds:
      - task: vulncheck

  verify:
    desc: Run API checks, race tests, and build
    cmds:
      - task: check
      - task: test:race
      - task: build
