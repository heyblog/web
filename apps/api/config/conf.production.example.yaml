# Deploy as config/conf.yaml beside the production binary.
mode: production

backup_cos:
  # Set true after replacing bucket/region, injecting API credentials and configuring CORS.
  # When false, database export works but import is unavailable in production.
  enabled: false
  bucket: your-backup-bucket-1250000000
  region: ap-singapore
  prefix: heyblog-database-uploads/

http:
  # Trust only the private Compose subnet used by the Web reverse proxy.
  # Keep this synchronized with HEYBLOG_NETWORK_SUBNET.
  trusted_proxies:
    - 172.31.0.0/24
  cors:
    # Browser access to api.heyblog.net is limited to anonymous GET/HEAD requests.
    # Add external browser origins explicitly; never place API keys in browser code.
    allow_origins:
      - https://www.heyblog.net
    allow_credentials: false

auth:
  # Public HTTPS origin reached by browsers, not the Web container address.
  web_base_url: https://www.heyblog.net
