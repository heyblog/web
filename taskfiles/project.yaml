# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  version:show:
    desc: Print the project version
    silent: true
    cmds:
      - node ./scripts/version.mjs show

  version:check:
    desc: Validate the canonical project version
    cmds:
      - node ./scripts/version.mjs check

  version:test:
    desc: Test project version management
    cmds:
      - node --test ./scripts/version.test.mjs

  version:set:
    desc: 'Set the project version (usage: task version:set -- X.Y.Z)'
    cmds:
      - node ./scripts/version.mjs set {{.CLI_ARGS}}

  version:patch:
    desc: Increment the project patch version
    cmds:
      - node ./scripts/version.mjs bump patch

  version:minor:
    desc: Increment the project minor version
    cmds:
      - node ./scripts/version.mjs bump minor

  version:major:
    desc: Increment the project major version
    cmds:
      - node ./scripts/version.mjs bump major

  apps:
    desc: List app status under apps
    silent: true
    cmds:
      - |
        cat <<'EOF'
        apps/api       The backend api server built with Gin
        apps/web       The frontend web app built with Astro
        EOF

  apps:dev:
    desc: Run core apps
    deps:
      - api:dev
      - web:dev

  install:
    desc: Install repository dependencies
    cmds:
      - pnpm install
      - go mod download
      - task: api:install

  prepare:
    desc: Prepare generated project inputs
    cmds:
      - task: web:prepare

  setup:
    desc: Install dependencies, Git hooks, and generated inputs
    cmds:
      - task: install
      - task: hooks:install
      - task: prepare

  format:
    desc: Format all active modules
    aliases: [fmt]
    cmds:
      - pnpm run format
      - task: configs:format
      - task: web:format
      - task: api:format

  format:check:
    desc: Check formatting for all active modules
    aliases: [fmt:check]
    cmds:
      - pnpm run format:check
      - task: configs:format:check
      - task: web:format:check
      - task: api:format:check

  lint:
    desc: Lint all active modules
    cmds:
      - pnpm run lint
      - task: configs:lint
      - task: web:lint
      - task: api:lint

  lint:fix:
    desc: Lint and fix all active modules
    cmds:
      - pnpm run lint:fix
      - task: configs:lint:fix
      - task: web:lint:fix
      - task: api:lint:fix

  build:
    desc: Build all active applications
    cmds:
      - task: api:build
      - task: web:build

  typecheck:
    desc: Type-check all Node workspace modules
    cmds:
      - pnpm run typecheck
      - task: configs:typecheck
      - task: web:typecheck

  check:
    desc: Run repository static checks
    cmds:
      - task: version:check
      - task: format:check
      - task: lint
      - task: typecheck
      - task: api:sqlc:vet
      - task: api:sqlc:diff
      - go tool actionlint

  test:
    desc: Run all configured tests
    cmds:
      - task: version:test
      - task: api:test
      - task: web:test

  test:race:
    desc: Run race-enabled tests
    cmds:
      - task: api:test:race

  test:integration:
    desc: Run integration tests
    cmds:
      - task: api:test:integration

  security:
    desc: Run checks that require vulnerability database access
    cmds:
      - pnpm audit --audit-level high
      - task: api:vulncheck

  verify:
    desc: Run all offline checks
    cmds:
      - task: check
      - task: test
      - task: build

  verify:full:
    desc: Run all checks, extended tests, builds, and scans
    cmds:
      - task: check
      - task: test:race
      - task: test:integration
      - task: web:test
      - task: build
      - task: security
      - task: container:verify
