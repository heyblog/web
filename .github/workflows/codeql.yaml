name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '43 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository
        if: matrix.language == 'go'
        uses: ./.github/actions/setup
        with:
          node: 'false'
          go: 'true'
          node-dependencies: 'false'
          root-go-dependencies: 'false'
          api-go-dependencies: 'true'

      - name: Expose Go compiler to CodeQL
        if: matrix.language == 'go'
        shell: bash
        run: dirname "$(mise which go)" >>"${GITHUB_PATH}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          build-mode: ${{ matrix.build-mode }}
          languages: ${{ matrix.language }}

      - name: Build Go
        if: matrix.language == 'go'
        working-directory: apps/api
        # CodeQL must invoke its tracing wrapper directly instead of through mise.
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
