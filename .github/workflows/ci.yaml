name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content:
    name: Prepare content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          go: 'false'
      - name: Prepare Web content
        run: mise run prepare
      - name: Upload Web content
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-content
          path: apps/web/contents
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  check:
    name: Check
    needs: content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Web content
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-content
          path: apps/web/contents
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          golangci-lint: 'true'
          shellcheck: 'true'
      - name: Check repository
        run: mise run check
      - name: Test repository scripts
        run: |
          mise run version:test
          mise run hooks:test
  api-race:
    name: API race test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          node: 'false'
          root-go-dependencies: 'false'
      - name: Test API with race detector
        run: mise run test:race
  api-integration:
    name: API integration test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          node: 'false'
          root-go-dependencies: 'false'
      - name: Test API integrations
        run: mise run test:integration
  web-test:
    name: Web test
    needs: content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Web content
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-content
          path: apps/web/contents
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          go: 'false'
      - name: Test Web
        run: mise run //apps/web:test
  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
      - name: Scan production dependencies
        id: scan
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]' }}
        run: mise run security
      - name: Report production scan failure
        if: ${{ !cancelled() && steps.scan.outcome == 'failure' }}
        env:
          SCAN_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          printf '::warning title=Production dependency security::生产依赖扫描未通过。请查看 Scan production dependencies 步骤日志：%s\n' "${SCAN_LOG_URL}"
          printf '### Production dependency security：扫描未通过\n\n生产依赖扫描发现漏洞或命令执行失败，请查看 [Scan production dependencies 步骤日志](%s)。\n' "${SCAN_LOG_URL}" >>"${GITHUB_STEP_SUMMARY}"
      - name: Scan development dependencies
        id: dev-scan
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: mise run security:dev
      - name: Report development scan failure
        if: ${{ !cancelled() && steps.dev-scan.outcome == 'failure' }}
        env:
          SCAN_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          printf '::warning title=Development dependency security::开发依赖扫描未通过，不阻断 CI。请查看 Scan development dependencies 步骤日志：%s\n' "${SCAN_LOG_URL}"
          printf '### Development dependency security：扫描未通过\n\n开发依赖扫描发现漏洞或命令执行失败，不阻断 CI。请查看 [Scan development dependencies 步骤日志](%s)。\n' "${SCAN_LOG_URL}" >>"${GITHUB_STEP_SUMMARY}"
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [content, check, api-race, api-integration, web-test, dependency-security]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "${JOB_RESULTS}" != 'success success success success success success' ]; then
            printf '::error title=CI gate::All six required jobs must succeed. Results: %s\n' "${JOB_RESULTS}"
            exit 1
          fi
