name: Container

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run whose commit and Web content will be built
        required: true
        type: string
      publish:
        description: Publish scanned images to the registry
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  REGISTRY: sgccr.ccs.tencentyun.com
  NAMESPACE: heyblog

jobs:
  source:
    name: Select verified source
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.source.outputs.build }}
      sha: ${{ steps.source.outputs.sha }}
      run-id: ${{ steps.source.outputs.run-id }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - name: Validate CI and identify merged PR author
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: |
          case "${CI_RUN_ID}" in
            ''|*[!0-9]*) printf '::error::ci_run_id must be a numeric CI run ID\n'; exit 1 ;;
          esac
          source_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          printf '%s' "${source_run}" | jq -e --arg repository "${GITHUB_REPOSITORY}" '
            .path == ".github/workflows/ci.yaml" and
            .repository.full_name == $repository and .head_repository.full_name == $repository and
            .head_branch == "main" and .status == "completed" and .conclusion == "success" and
            (.event == "push" or .event == "workflow_dispatch") and
            (.head_sha | test("^[0-9a-f]{40}$"))
          ' >/dev/null
          source_sha="$(printf '%s' "${source_run}" | jq -r .head_sha)"
          source_event="$(printf '%s' "${source_run}" | jq -r .event)"
          source_attempt="$(printf '%s' "${source_run}" | jq -r .run_attempt)"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/attempts/${source_attempt}/jobs?per_page=100" |
            jq -e '[.[] | .jobs[] | select(.name == "CI gate")] |
              length == 1 and all(.status == "completed" and .conclusion == "success")' >/dev/null
          if [ "${GITHUB_EVENT_NAME}" = workflow_run ] && [ "${source_event}" = push ]; then
            renovate_merge="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/commits/${source_sha}/pulls?per_page=100" |
              jq -r --arg sha "${source_sha}" --arg repository "${GITHUB_REPOSITORY}" '
                [.[][] | select(.merged_at != null and .merge_commit_sha == $sha and
                  .base.ref == "main" and .base.repo.full_name == $repository)] |
                length > 0 and all(.user.login == "renovate[bot]")
              ')"
            if [ "${renovate_merge}" = true ]; then
              printf 'build=false\n' >>"${GITHUB_OUTPUT}"
              printf 'Renovate 合并已通过 CI；按策略跳过镜像构建和发布。\n' >>"${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi
          publish=false
          if { [ "${GITHUB_EVENT_NAME}" = workflow_run ] && [ "${source_event}" = push ]; } ||
            { [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${REQUEST_PUBLISH}" = true ]; }; then
            publish=true
          fi
          printf 'build=true\nsha=%s\nrun-id=%s\npublish=%s\n' "${source_sha}" "${CI_RUN_ID}" "${publish}" >>"${GITHUB_OUTPUT}"
  container:
    name: Build and scan images
    needs: source
    if: needs.source.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Download verified Web content
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-content
          path: apps/web/contents
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.run-id }}
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          node: 'false'
          go: 'false'
          node-dependencies: 'false'
          root-go-dependencies: 'false'
          api-go-dependencies: 'false'
      - name: Build container images
        run: mise run container:build
      - name: Scan container images
        run: mise run container:scan
      - name: Log in to Tencent CCR
        if: needs.source.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_CCR_USERNAME }}
          password: ${{ secrets.TENCENT_CCR_PASSWORD }}
      - name: Publish immutable images
        if: needs.source.outputs.publish == 'true'
        env:
          IMAGE_TAGS: ${{ needs.source.outputs.sha }}
        run: mise run container:publish
      - name: Publish latest images when main is current
        if: needs.source.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          IMAGE_TAGS: latest
        run: |
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "${remote_sha}" = "${SOURCE_SHA}" ]; then
            mise run container:publish
          fi
