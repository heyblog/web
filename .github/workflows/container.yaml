name: Container

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run whose commit and Web content will be built
        required: true
        type: string
      publish:
        description: Publish scanned images to the registry
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

env:
  REGISTRY: sgccr.ccs.tencentyun.com
  NAMESPACE: heyblog

jobs:
  source:
    name: Select verified source
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.source.outputs.build }}
      sha: ${{ steps.source.outputs.sha }}
      run-id: ${{ steps.source.outputs.run-id }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - name: Validate CI source and gate
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: |
          case "${CI_RUN_ID}" in
            ''|*[!0-9]*) printf '::error::ci_run_id must be a numeric CI run ID\n'; exit 1 ;;
          esac
          source_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          printf '%s' "${source_run}" | jq -e --arg repository "${GITHUB_REPOSITORY}" '
            .path == ".github/workflows/ci.yaml" and
            .repository.full_name == $repository and .head_repository.full_name == $repository and
            .head_branch == "main" and .status == "completed" and .conclusion == "success" and
            (.event == "push" or .event == "workflow_dispatch") and
            (.head_sha | test("^[0-9a-f]{40}$"))
          ' >/dev/null
          source_sha="$(printf '%s' "${source_run}" | jq -r .head_sha)"
          source_event="$(printf '%s' "${source_run}" | jq -r .event)"
          source_attempt="$(printf '%s' "${source_run}" | jq -r .run_attempt)"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/attempts/${source_attempt}/jobs?per_page=100" |
            jq -e '[.[] | .jobs[] | select(.name == "CI gate")] |
              length == 1 and all(.status == "completed" and .conclusion == "success")' >/dev/null
          publish=false
          if { [ "${GITHUB_EVENT_NAME}" = workflow_run ] && [ "${source_event}" = push ]; } ||
            { [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${REQUEST_PUBLISH}" = true ]; }; then
            publish=true
          fi
          printf 'build=true\nsha=%s\nrun-id=%s\npublish=%s\n' "${source_sha}" "${CI_RUN_ID}" "${publish}" >>"${GITHUB_OUTPUT}"
  container:
    name: Build and scan images
    needs: source
    if: needs.source.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.release.outputs.images }}
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Download verified Web content
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-content
          path: apps/web/contents
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.run-id }}
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          node: 'false'
          go: 'false'
          node-dependencies: 'false'
          root-go-dependencies: 'false'
          api-go-dependencies: 'false'
      - name: Build container images
        run: mise run container:build
      - name: Scan container images
        run: mise run container:scan
      - name: Log in to Tencent CCR
        if: needs.source.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_CCR_USERNAME }}
          password: ${{ secrets.TENCENT_CCR_PASSWORD }}
      - name: Publish immutable images
        id: release
        if: needs.source.outputs.publish == 'true'
        shell: bash
        env:
          IMAGE_TAGS: ${{ needs.source.outputs.sha }}
          DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          if [ "${DEPLOY_ENABLED}" = 'true' ]; then
            PUBLISH_DIGESTS_FILE=$(mktemp)
            export PUBLISH_DIGESTS_FILE
          fi
          mise run container:publish
          if [ -n "${PUBLISH_DIGESTS_FILE:-}" ]; then
            images=$(jq -Rnec '[inputs | split(" ") | {(.[0]): .[1]}] | add' "${PUBLISH_DIGESTS_FILE}")
            printf 'images=%s\n' "${images}" >>"${GITHUB_OUTPUT}"
          fi
      - name: Publish latest images when main is current
        if: needs.source.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          IMAGE_TAGS: latest
        run: |
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "${remote_sha}" = "${SOURCE_SHA}" ]; then
            mise run container:publish
            printf '已更新 API 和 Web 的 latest 标签：源码 SHA %s。\n' "${SOURCE_SHA}" | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            printf '跳过 latest 更新：源码 SHA %s 与当前 main SHA %s 不一致；SHA 标签已发布。\n' "${SOURCE_SHA}" "${remote_sha}" | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
  deploy:
    name: Deploy and check production
    needs: [source, container]
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && needs.container.outputs.images != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    concurrency:
      group: heyblog-production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy current main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          RELEASE_IMAGES: ${{ needs.container.outputs.images }}
          DEPLOYER_NOTIFY_URL: ${{ vars.DEPLOYER_NOTIFY_URL }}
          DEPLOYER_NOTIFY_SECRET: ${{ secrets.DEPLOYER_NOTIFY_SECRET }}
        shell: bash
        run: |
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "${remote_sha}" != "${SOURCE_SHA}" ]; then
            printf 'Skipping deployment for superseded commit %s.\n' "${SOURCE_SHA}" >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { createHmac } from 'node:crypto';
          import { setTimeout } from 'node:timers/promises';
          import { appendFileSync } from 'node:fs';

          const { DEPLOYER_NOTIFY_URL, DEPLOYER_NOTIFY_SECRET, SOURCE_SHA, RELEASE_IMAGES } = process.env;
          if (!DEPLOYER_NOTIFY_URL || !DEPLOYER_NOTIFY_SECRET) {
            throw new Error('Configure the production deployment URL and signing secret.');
          }
          const url = new URL(DEPLOYER_NOTIFY_URL);
          if (url.protocol !== 'https:' || url.pathname !== '/webhooks/deploy' ||
              url.username || url.password || url.search || url.hash) {
            throw new Error('The production deployment URL must be HTTPS and use /webhooks/deploy.');
          }
          const id = process.env.GITHUB_RUN_ID + '-' + process.env.GITHUB_RUN_ATTEMPT;
          const body = JSON.stringify({ id, commit_sha: SOURCE_SHA, images: JSON.parse(RELEASE_IMAGES) });
          const statusURL = new URL(url);
          statusURL.pathname += '/' + id;

          async function request(target, method, message, payload) {
            const signature = createHmac('sha256', DEPLOYER_NOTIFY_SECRET).update(message).digest('hex');
            for (let attempt = 1; ; attempt++) {
              try {
                const response = await fetch(target, {
                  method, body: payload, redirect: 'error', signal: AbortSignal.timeout(10000),
                  headers: { 'content-type': 'application/json', 'x-zhblogs-signature-256': 'sha256=' + signature },
                });
                if (attempt === 3 || ![502, 503, 504].includes(response.status)) return response;
                await response.body?.cancel();
              } catch (error) {
                if (attempt === 3) throw error;
              }
              await setTimeout(2000);
            }
          }

          const accepted = await request(url, 'POST', body, body);
          if (!accepted.ok) throw new Error('Deployer rejected the release (HTTP ' + accepted.status + ').');
          let status = await accepted.json();
          for (let attempt = 0; status.status === 'running' && attempt < 110; attempt++) {
            await setTimeout(5000);
            const response = await request(statusURL, 'GET', 'GET ' + statusURL.pathname);
            if (!response.ok) throw new Error('Deployment status unavailable (HTTP ' + response.status + ').');
            status = await response.json();
          }
          if (status.id !== id || status.commit_sha !== SOURCE_SHA) {
            throw new Error('Deployer returned a different release.');
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Production ' + SOURCE_SHA + ': ' + status.status + '\n');
          if (status.status !== 'success') throw new Error('Production deployment result: ' + status.status);
          NODE
