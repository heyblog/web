map $http_eo_connecting_ip $heyblog_client_ip {
  default $http_eo_connecting_ip;
  ""      $remote_addr;
}

map $uri $heyblog_asset_cache_control {
  default    "";
  ~^/_astro/ "public, max-age=31536000, immutable";
}

log_format heyblog_json escape=json
  '{"time":"$time_iso8601","client_ip":"$heyblog_client_ip",'
  '"request_id":"$request_id","host":"$host","method":"$request_method",'
  '"uri":"$uri","protocol":"$server_protocol","status":$status,'
  '"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time"}';

server {
  listen 80;
  listen [::]:80;
  server_name heyblog.net www.heyblog.net;

  server_tokens off;

  access_log /var/log/nginx/heyblog.access.log heyblog_json;
  error_log /var/log/nginx/heyblog.error.log;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location / {
    return 308 https://www.heyblog.net$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name heyblog.net;

  ssl_certificate /etc/letsencrypt/live/heyblog.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/heyblog.net/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_ecdh_curve X25519:secp256r1;
  ssl_session_timeout 1d;
  ssl_session_cache shared:HeyBlogSSL:10m;
  ssl_session_tickets off;

  server_tokens off;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  access_log /var/log/nginx/heyblog.access.log heyblog_json;
  error_log /var/log/nginx/heyblog.error.log;

  return 308 https://www.heyblog.net$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.heyblog.net;

  ssl_certificate /etc/letsencrypt/live/heyblog.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/heyblog.net/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_ecdh_curve X25519:secp256r1;
  ssl_session_timeout 1d;
  ssl_session_cache shared:HeyBlogSSL:10m;
  ssl_session_tickets off;

  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/atom+xml application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/xml application/xml+rss image/svg+xml text/css text/javascript text/plain text/xml;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Cache-Control $heyblog_asset_cache_control;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "0" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-site" always;

  access_log /var/log/nginx/heyblog.access.log heyblog_json;
  error_log /var/log/nginx/heyblog.error.log;

  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 60s;
  reset_timedout_connection on;

  proxy_http_version 1.1;
  proxy_set_header Connection "";

  proxy_set_header Host www.heyblog.net;
  proxy_set_header X-Real-IP $heyblog_client_ip;
  proxy_set_header X-Forwarded-For $heyblog_client_ip;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host www.heyblog.net;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Request-ID $request_id;

  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  proxy_buffering on;
  proxy_request_buffering on;
  proxy_intercept_errors off;
  proxy_redirect off;
  proxy_hide_header X-Powered-By;

  location ~ /\.(?!well-known(?:/|$)) {
    deny all;
  }

  location ^~ /_astro/ {
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Powered-By;
    proxy_pass http://127.0.0.1:10101;
  }

  location / {
    proxy_pass http://127.0.0.1:10101;
  }
}
