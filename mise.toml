min_version = "2026.11.12"
monorepo_root = true

[monorepo]
config_roots = [
  "apps/api",
  "apps/worker",
  "apps/web",
  "apps/edge",
  "packages/go/edgerequest",
  "packages/go/taskprotocol",
  "packages/node/configs",
]
lockfile = true

[task_config]
cascade = true
shell = "bash -o errexit -o pipefail -c"

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
node = "26.13.1"
pnpm = "12.21.0"
shellcheck = "0.11.0"

[vars]
project_version = "0.3.4"
