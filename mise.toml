min_version = "2026.10.0"
monorepo_root = true

[monorepo]
config_roots = ["apps/api", "apps/web", "packages/node/configs"]
lockfile = true

[task_config]
cascade = true
shell = "bash -o errexit -o pipefail -c"

[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
node = "24.21.0"
pnpm = "12.6.0"
shellcheck = "0.11.0"

[vars]
project_version = "0.2.2"
