min_version = "2026.10.17"
monorepo_root = true

[monorepo]
config_roots = ["apps/api", "apps/web", "packages/node/configs"]
lockfile = true

[task_config]
cascade = true
shell = "bash -o errexit -o pipefail -c"

[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
node = "24.22.1"
pnpm = "12.14.0"
shellcheck = "0.11.0"

[vars]
project_version = "0.3.4"
